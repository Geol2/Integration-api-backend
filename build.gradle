plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.integration'
version = '0.0.1-SNAPSHOT'
description = '통합 API 백엔드 — 계정별 데이터(일기/설정/할일/메모) REST API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Web Push (VAPID + aes128gcm) for todo reminders. BouncyCastle is required at
	// runtime — the JDK's own EC provider can't do the ECDH/HKDF key agreement that
	// push payload encryption needs.
	implementation 'nl.martijndwars:web-push:5.1.1'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

	// PostgreSQL — used for both dev (localhost:5433) and prod
	runtimeOnly 'org.postgresql:postgresql'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Prints a VAPID key pair for the push reminders: ./gradlew -q vapidKeys
// Run once per environment; rotating the public key invalidates every browser
// subscription, forcing all users to re-enable alerts.
tasks.register('vapidKeys', JavaExec) {
	group = 'application'
	description = 'Generate a VAPID key pair for Web Push'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.integration.push.VapidKeyGenerator'
}
