server:
  port: 8080

spring:
  application:
    name: integration-api-backend

  # ---- Dev default: H2 file DB (no external DB needed) ----
  datasource:
    url: jdbc:h2:file:./data/integration;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update      # dev only; use Flyway/Liquibase migrations for prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console      # http://localhost:8080/h2-console

# Frontend origin allowed to call this API (Vite dev server)
app:
  cors:
    allowed-origin: http://localhost:5173

---
# ---- Prod profile: PostgreSQL ----
# Run with: --spring.profiles.active=prod  (and set the env vars below)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/integration}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:integration}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
