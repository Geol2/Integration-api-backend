server:
  port: 9090
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    # 크기를 초과한 업로드는 파싱 단계에서 거부되는데, 남은 본문을 읽어 비우지 않으면
    # 톰캣이 연결을 끊어버려 브라우저가 413 대신 네트워크 오류를 보게 됩니다.
    max-swallow-size: -1

spring:
  application:
    name: integration-api-backend

  # ---- 회의록 녹음 업로드 ----
  # 기본값(파일 1MB)이면 몇 분짜리 녹음도 거부됩니다. 32kbps 기준 1시간이 약 14MB이고,
  # 상한은 Cloudflare 무료 플랜의 100MB에 맞췄습니다.
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  # ---- Dev default: local PostgreSQL (matches prod's DB engine) ----
  # DB_PASSWORD has no default on purpose — export it in your shell before running
  # (e.g. `export DB_PASSWORD=...`), don't hardcode it here since this file is committed.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/integration}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:integration}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update      # dev only; use Flyway/Liquibase migrations for prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ---- Email (Gmail SMTP) — used to deliver signup verification codes ----
  # Set MAIL_USERNAME (your Gmail address) and MAIL_APP_PASSWORD (a Google
  # "app password", NOT your login password) in your shell before running.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Frontend origin allowed to call this API (Vite dev server)
app:
  cors:
    allowed-origin: http://localhost:5173
  jwt:
    # Dev-only placeholder — override via JWT_SECRET env var. Must be >=32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-32bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}   # 24h — convenient for local dev
  # ---- Web Push (할 일 시간 알림) ----
  # Generate the key pair once with `./gradlew -q vapidKeys` and export both values.
  # Leaving them unset simply disables reminders — the API still boots normally.
  push:
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:mailto:big9401@gmail.com}
    # dateKey/timeLabel are local wall-clock as typed by the user, so they're resolved in this zone.
    zone: ${PUSH_ZONE:Asia/Seoul}
    default-lead-minutes: ${PUSH_LEAD_MINUTES:10}   # used when a user hasn't picked their own
    grace-minutes: ${PUSH_GRACE_MINUTES:30}         # how late a missed reminder may still arrive
    app-url: ${PUSH_APP_URL:http://localhost:5173}  # opened when the notification is tapped

  # ---- 회의록 녹음 → n8n 전달 ----
  # 브라우저는 /api/recordings 로만 보내고, 웹훅 주소와 키는 여기(서버)에만 둡니다.
  # 프론트에 두면 번들에 인라인되어 누구나 읽을 수 있고, 공유 키라 "누가 올렸는지"도
  # 알 수 없었습니다. 비워두면 업로드가 503으로 응답할 뿐 API는 정상 기동합니다.
  recording:
    webhook-url: ${N8N_RECORDING_WEBHOOK_URL:}
    webhook-key: ${N8N_RECORDING_KEY:}

  verification:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}        # sender shown on the code email
    code-ttl-minutes: ${VERIFY_TTL_MINUTES:10}  # how long a code stays valid
    resend-cooldown-seconds: ${VERIFY_RESEND_COOLDOWN:60}
    max-attempts: ${VERIFY_MAX_ATTEMPTS:5}      # wrong tries before a code is burned

---
# ---- Prod profile: PostgreSQL ----
# Run with: --spring.profiles.active=prod  (and set the env vars below)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/integration}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:integration}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:https://momentum.geol2.com}
  jwt:
    secret: ${JWT_SECRET}                              # no default — fail fast if unset in prod
    # 7일. 슬라이딩 만료(JwtAuthenticationFilter)가 사용 중에는 계속 연장해주므로,
    # 이 값은 "완전히 방치된 세션이 죽는 시점"을 뜻합니다. 60분이던 시절에는 잠깐
    # 자리를 비우기만 해도 할 일 등록이 실패했습니다.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  push:
    app-url: ${PUSH_APP_URL:https://momentum.geol2.com}
