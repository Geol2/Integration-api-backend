server:
  port: 9090
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: integration-api-backend

  # ---- Dev default: local PostgreSQL (matches prod's DB engine) ----
  # DB_PASSWORD has no default on purpose — export it in your shell before running
  # (e.g. `export DB_PASSWORD=...`), don't hardcode it here since this file is committed.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/integration}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:integration}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update      # dev only; use Flyway/Liquibase migrations for prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Frontend origin allowed to call this API (Vite dev server)
app:
  cors:
    allowed-origin: http://localhost:5173
  jwt:
    # Dev-only placeholder — override via JWT_SECRET env var. Must be >=32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-32bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}   # 24h — convenient for local dev

---
# ---- Prod profile: PostgreSQL ----
# Run with: --spring.profiles.active=prod  (and set the env vars below)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/integration}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:integration}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:https://momentum.geol2.com}
  jwt:
    secret: ${JWT_SECRET}                              # no default — fail fast if unset in prod
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
